eyre.workspace = true
futures.workspace = true
itertools.workspace = true
num_cpus.workspace = true
# once_cell.workspace = true
parking_lot.workspace = true
prometheus.workspace = true
# rand.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
# signature.workspace = true
# tempfile.workspace = true
# thiserror.workspace = true
tokio = { workspace = true, features = ["full", "tracing", "test-util"] }
# tokio-retry.workspace = true
# tokio-stream.workspace = true
tracing.workspace = true
url.workspace = true
fastcrypto.workspace = true

mysten-metrics.workspace = true
config = { path = "../../narwhal/config", package = "narwhal-config" }
crypto = { path = "../../narwhal/crypto", package = "narwhal-crypto" }
types = { path = "../../narwhal/types", package = "narwhal-types" }
executor = { path = "../../narwhal/executor", package = "narwhal-executor" }
node = { path = "../../narwhal/node", package = "narwhal-node" }
storage = { path = "../../narwhal/storage", package = "narwhal-storage" }
