# narwhal-crypto.workspace = true
# narwhal-executor.workspace = true
# narwhal-network.workspace = true
# narwhal-types.workspace = true
# narwhal-worker.workspace = true
# shared-crypto.workspace = true
# sui-archival.workspace = true
sui-config.workspace = true
# sui-framework.workspace = true
# sui-swarm-config.workspace = true
# sui-genesis-builder.workspace = true
sui-keys.workspace = true
# sui-json-rpc-types.workspace = true
sui-macros.workspace = true
sui-network.workspace = true
sui-protocol-config.workspace = true
# sui-simulator.workspace = true
# sui-storage.workspace = true
sui-types.workspace = true
tracing-subscriber.workspace = true
# workspace-hack.workspace = true
sui-core.workspace = true
telemetry-subscribers.workspace = true


sslab-execution = { workspace = true, features = ["benchmark"] }
sslab-execution-serial = { workspace = true }
# sslab-execution-optme = { workspace = true, optional = true }
fail = "0.5.1"
prost = "0.11"
rand = "0.8.5"
tonic = "0.8.2"
bincode = "1.3.3"

[dev-dependencies]
criterion.workspace = true
ethers-core = "^2.0.0"
ethers-providers = { version = "^2.0.0" }
rayon = "1.8.0"

[features]
benchmark = ["sslab-execution/benchmark"]

# execution model
# optme = ["sslab-execution-optme"]
serial = []

[[bin]]
name = "sslab-narwhal-node"
path = "src/main.rs"

[[bench]]
name = "decoding"
harness = false
