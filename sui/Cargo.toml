[workspace.package]
# This version string will be inherited by sui-core, sui-faucet, sui-node, sui-tools, sui-sdk, and sui crates
version = "0.28.0"

[profile.release]
# debug = 1 means line charts only, which is minimum needed for good stack traces
debug = 1
# Write debug info into a separate file.
split-debuginfo = 'packed'
# Without stripping, sui binary size would be > 1GB.
strip = 'debuginfo'
# Exit process with SIGABRT when any thread panics
panic = 'abort'

# Inherits from the release profile above.
[profile.bench]
# For convenience.
strip = 'none'

[profile.test.package.move-compiler]
# opt-level 2 for move-compiler reduces the size of some of its
# (recursive) stack frames by up to 10x, avoiding stack overflows.
opt-level = 2

[profile.simulator]
inherits = "test"
debug = true
debug-assertions = true
overflow-checks = true
# opt-level 1 gives >5x speedup for simulator tests without slowing down build times very much.
opt-level = 1

# Dependencies that should be kept in sync through the whole workspace
[workspace.dependencies]
# quote = "1.0.23"
tokio = "1.24.1"
tokio-retry = "0.3"
tokio-stream = { version = "0.1.14", features = ["sync", "net"] }
async-trait = "0.1.61"
itertools = "0.10.5"
num_cpus = "1.15.0"
parking_lot = "0.12.1"
tracing = "0.1.37"
criterion = { version = "0.4.0", features = [
    "async",
    "async_tokio",
    "html_reports",
] }
bytes = "1.5.0"
cfg-if = "1.0.0"
dashmap = "5.4.0"
eyre = "0.6.8"
futures = "0.3.25"
rayon = "1.5.3"
serde = { version = "1.0.144", features = ["derive", "rc"] }
serde_json = { version = "1.0.95", features = [
    "preserve_order",
    "arbitrary_precision",
] }
serde_with = { version = "2.1.0", features = ["hex"] }
sui-protocol-config = { path = "crates/sui-protocol-config" }
# thiserror = "1.0.40"
tracing-subscriber = { version = "0.3.15", default-features = false, features = [
    "std",
    "smallvec",
    "fmt",
    "ansi",
    "time",
    "json",
    "registry",
